<div class="shell">
  <div
    class="shell__sidebar"
    [class.shell__sidebar--abierto]="layout.menuMovilAbierto()"
  >
    <app-sidebar></app-sidebar>
  </div>

  <div
    class="shell__overlay"
    *ngIf="layout.menuMovilAbierto()"
    (click)="layout.cerrarMenuMovil()"
  ></div>

  <div class="shell__principal">
    <app-topbar [titulo]="titulo()"></app-topbar>

    <main class="shell__contenido">
      <router-outlet></router-outlet>
    </main>
  </div>

  <p-toast position="top-right"></p-toast>
</div>
